name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  composer-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict --no-check-publish

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f contao/templates/.twig-root
      - run: ls contao/templates/component/_*.twig contao/templates/content_element/*.twig
      - run: test -f public/kern/kern.min.css && test -f public/kern/fonts/fira-sans.css
